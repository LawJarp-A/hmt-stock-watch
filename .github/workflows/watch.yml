name: watch

# The Cloudflare Worker (cloudflare/worker.js) is now the live monitor -- its
# cron genuinely fires every minute, where this one drifted 5-20 min and took
# 22 minutes to start at all. The schedule here is disabled so a restock does
# not produce two alerts from two systems.
#
# This still runs on demand and is a working fallback: re-add a `schedule:`
# block here if Cloudflare is ever unavailable.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: hot or all
        default: hot

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python3 watch.py --tier "${{ inputs.tier || (github.event.schedule == '7,37 * * * *' && 'all' || 'hot') }}"
      - name: Commit state
        run: |
          git config user.name  "hmt-watch-bot"
          git config user.email "actions@github.com"
          git add -A state.json docs/
          git diff --staged --quiet && exit 0
          git commit -m "state: $(date -u +%H:%MZ) [skip ci]"
          # discover.yml may have pushed since checkout. Rebase rather than fail:
          # a failed push would drop this run's state, and the next run would
          # re-detect the same transition and alert twice.
          for i in 1 2 3; do
            git pull --rebase --autostash -q && git push && exit 0
            sleep 5
          done
          exit 1
